<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoho CRM - Enterprise CRM Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --zoho-blue: #00598b;
            --zoho-light-blue: #0077b5;
            --zoho-dark-blue: #003d66;
            --zoho-bg: #f4f6f9;
            --zoho-white: #ffffff;
            --zoho-border: #dde3eb;
            --sidebar-dark: #1a2737;
            --sidebar-hover: #243447;
            --sidebar-active: #2d4a63;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --info: #17a2b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--zoho-bg);
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
            overflow: hidden;
            height: 100vh;
        }

        /* Top Header */
        .top-header {
            background: linear-gradient(135deg, var(--zoho-dark-blue) 0%, var(--zoho-blue) 100%);
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1001;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .top-header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .zoho-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-weight: 700;
            font-size: 20px;
        }

        .zoho-logo i {
            font-size: 28px;
        }

        .global-search {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.15);
            border-radius: 6px;
            padding: 8px 16px;
            width: 400px;
            transition: all 0.3s;
        }

        .global-search:focus-within {
            background: rgba(255,255,255,0.25);
            box-shadow: 0 0 0 2px rgba(255,255,255,0.3);
        }

        .global-search i {
            color: rgba(255,255,255,0.7);
            margin-right: 10px;
        }

        .global-search input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 14px;
        }

        .global-search input::placeholder {
            color: rgba(255,255,255,0.6);
        }

        .top-header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-icon-btn {
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.2s;
            position: relative;
        }

        .header-icon-btn:hover {
            background: rgba(255,255,255,0.15);
        }

        .header-icon-btn .badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 10px;
            font-weight: 600;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .user-profile:hover {
            background: rgba(255,255,255,0.15);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        /* Main Layout */
        .main-container {
            display: flex;
            margin-top: 56px;
            height: calc(100vh - 56px);
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background: var(--sidebar-dark);
            color: white;
            overflow-y: auto;
            flex-shrink: 0;
            transition: width 0.3s;
        }

        .sidebar.collapsed {
            width: 60px;
        }

        .sidebar-section {
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-section-title {
            padding: 0 20px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 10px;
        }

        .sidebar.collapsed .sidebar-section-title {
            display: none;
        }

        .sidebar-menu-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: rgba(255,255,255,0.8);
            cursor: pointer;
            transition: all 0.2s;
            gap: 12px;
            position: relative;
        }

        .sidebar-menu-item:hover {
            background: var(--sidebar-hover);
            color: white;
        }

        .sidebar-menu-item.active {
            background: var(--sidebar-active);
            color: white;
        }

        .sidebar-menu-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--zoho-light-blue);
        }

        .sidebar-menu-item i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar-menu-item span {
            flex: 1;
            white-space: nowrap;
        }

        .sidebar-menu-item .sub-arrow {
            font-size: 10px;
            transition: transform 0.2s;
        }

        .sidebar-menu-item.expanded .sub-arrow {
            transform: rotate(90deg);
        }

        .sidebar-submenu {
            display: none;
            background: rgba(0,0,0,0.2);
        }

        .sidebar-menu-item.expanded + .sidebar-submenu {
            display: block;
        }

        .sidebar-submenu-item {
            padding: 10px 20px 10px 52px;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }

        .sidebar-submenu-item:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .sidebar-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            cursor: pointer;
            color: rgba(255,255,255,0.6);
            transition: all 0.2s;
        }

        .sidebar-toggle:hover {
            color: white;
            background: rgba(255,255,255,0.1);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            overflow-y: auto;
            background: var(--zoho-bg);
        }

        /* Page Header */
        .page-header {
            background: white;
            padding: 20px 25px;
            border-bottom: 1px solid var(--zoho-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .page-header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .page-breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .page-breadcrumb a {
            color: var(--zoho-blue);
            text-decoration: none;
        }

        .page-breadcrumb a:hover {
            text-decoration: underline;
        }

        .page-header-actions {
            display: flex;
            gap: 10px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--zoho-blue);
            color: white;
        }

        .btn-primary:hover {
            background: var(--zoho-dark-blue);
            box-shadow: 0 2px 8px rgba(0,89,139,0.3);
        }

        .btn-secondary {
            background: white;
            color: var(--text-primary);
            border: 1px solid var(--zoho-border);
        }

        .btn-secondary:hover {
            background: var(--zoho-bg);
            border-color: var(--zoho-blue);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-icon {
            padding: 10px;
            min-width: 40px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
        }

        /* View Tabs */
        .view-tabs {
            display: flex;
            gap: 0;
            background: white;
            border: 1px solid var(--zoho-border);
            border-radius: 8px;
            padding: 4px;
        }

        .view-tab {
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .view-tab:hover {
            background: var(--zoho-bg);
        }

        .view-tab.active {
            background: var(--zoho-blue);
            color: white;
        }

        /* Toolbar */
        .toolbar {
            background: white;
            padding: 15px 25px;
            border-bottom: 1px solid var(--zoho-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toolbar-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border: 1px solid var(--zoho-border);
            border-radius: 6px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            color: var(--text-primary);
        }

        .toolbar-btn:hover {
            background: var(--zoho-bg);
            border-color: var(--zoho-blue);
        }

        .toolbar-btn.active {
            background: var(--zoho-blue);
            color: white;
            border-color: var(--zoho-blue);
        }

        .toolbar-btn i {
            font-size: 14px;
        }

        /* Density Toggle */
        .density-toggle {
            display: flex;
            border: 1px solid var(--zoho-border);
            border-radius: 6px;
            overflow: hidden;
        }

        .density-btn {
            padding: 8px 12px;
            background: white;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .density-btn:hover {
            background: var(--zoho-bg);
        }

        .density-btn.active {
            background: var(--zoho-blue);
            color: white;
        }

        .density-btn:not(:last-child) {
            border-right: 1px solid var(--zoho-border);
        }

        /* Table */
        .table-container {
            background: white;
            margin: 20px 25px;
            border-radius: 8px;
            border: 1px solid var(--zoho-border);
            overflow: hidden;
        }

        .table-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 1px solid var(--zoho-border);
            background: #fafbfc;
        }

        .table-info {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table thead {
            background: #f8f9fa;
            border-bottom: 2px solid var(--zoho-border);
        }

        .data-table th {
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        .data-table th:hover {
            background: #e9ecef;
        }

        .data-table th .sort-icon {
            margin-left: 5px;
            font-size: 11px;
        }

        .data-table tbody tr {
            border-bottom: 1px solid var(--zoho-border);
            transition: all 0.15s;
        }

        .data-table tbody tr:hover {
            background: #f0f7ff;
        }

        .data-table tbody tr.selected {
            background: #e3f2fd;
        }

        .data-table td {
            padding: 14px 15px;
            font-size: 14px;
            vertical-align: middle;
        }

        .data-table td.checkbox-cell {
            width: 40px;
        }

        .record-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--zoho-blue);
        }

        .record-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .record-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 12px;
            flex-shrink: 0;
        }

        .record-name-text {
            font-weight: 500;
            color: var(--zoho-blue);
            cursor: pointer;
        }

        .record-name-text:hover {
            text-decoration: underline;
        }

        .record-email {
            color: var(--text-muted);
            font-size: 12px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.Active {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.Inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .status-badge.Pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-badge.New {
            background: #cce5ff;
            color: #004085;
        }

        .priority-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .priority-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .priority-dot.High {
            background: var(--danger);
        }

        .priority-dot.Medium {
            background: var(--warning);
        }

        .priority-dot.Low {
            background: var(--success);
        }

        .action-btns {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            border: 1px solid var(--zoho-border);
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--zoho-bg);
            color: var(--zoho-blue);
            border-color: var(--zoho-blue);
        }

        .action-btn i {
            font-size: 13px;
        }

        /* Pagination */
        .pagination-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: #fafbfc;
            border-top: 1px solid var(--zoho-border);
        }

        .pagination-info {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .pagination-btn {
            width: 34px;
            height: 34px;
            border: 1px solid var(--zoho-border);
            border-radius: 6px;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: var(--text-primary);
        }

        .pagination-btn:hover:not(:disabled) {
            background: var(--zoho-bg);
            border-color: var(--zoho-blue);
        }

        .pagination-btn.active {
            background: var(--zoho-blue);
            color: white;
            border-color: var(--zoho-blue);
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px 25px;
        }

        .record-card {
            background: white;
            border-radius: 8px;
            border: 1px solid var(--zoho-border);
            overflow: hidden;
            transition: all 0.2s;
            cursor: pointer;
        }

        .record-card:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .card-header {
            padding: 15px;
            border-bottom: 1px solid var(--zoho-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-body {
            padding: 15px;
        }

        .card-field {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .card-field:last-child {
            border-bottom: none;
        }

        .card-field-label {
            color: var(--text-muted);
            font-size: 13px;
        }

        .card-field-value {
            font-weight: 500;
            font-size: 13px;
        }

        /* Dashboard */
        .dashboard {
            padding: 25px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid var(--zoho-border);
            transition: all 0.2s;
        }

        .stat-card:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .stat-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .stat-card-icon {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .stat-card-icon.blue {
            background: #e3f2fd;
            color: var(--zoho-blue);
        }

        .stat-card-icon.green {
            background: #d4edda;
            color: var(--success);
        }

        .stat-card-icon.orange {
            background: #fff3cd;
            color: #fd7e14;
        }

        .stat-card-icon.red {
            background: #f8d7da;
            color: var(--danger);
        }

        .stat-card-trend {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 500;
        }

        .stat-card-trend.up {
            color: var(--success);
        }

        .stat-card-trend.down {
            color: var(--danger);
        }

        .stat-card-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .stat-card-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .dashboard-charts {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .chart-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid var(--zoho-border);
        }

        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
        }

        .chart-actions {
            display: flex;
            gap: 10px;
        }

        .chart-container {
            position: relative;
            height: 280px;
        }

        .activity-feed {
            max-height: 350px;
            overflow-y: auto;
        }

        .activity-item {
            display: flex;
            gap: 12px;
            padding: 15px 0;
            border-bottom: 1px solid var(--zoho-border);
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--zoho-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--zoho-blue);
        }

        .activity-content {
            flex: 1;
        }

        .activity-text {
            font-size: 13px;
            line-height: 1.5;
        }

        .activity-text strong {
            color: var(--text-primary);
        }

        .activity-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Detail View */
        .detail-view {
            display: flex;
            height: calc(100vh - 56px);
        }

        .detail-main {
            flex: 1;
            overflow-y: auto;
            background: var(--zoho-bg);
        }

        .detail-sidebar {
            width: 380px;
            background: white;
            border-left: 1px solid var(--zoho-border);
            overflow-y: auto;
        }

        .detail-header {
            background: white;
            padding: 25px;
            border-bottom: 1px solid var(--zoho-border);
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }

        .detail-avatar {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 24px;
            flex-shrink: 0;
        }

        .detail-header-info {
            flex: 1;
        }

        .detail-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .detail-subtitle {
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .detail-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .detail-tag {
            padding: 4px 12px;
            background: var(--zoho-bg);
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .detail-actions {
            display: flex;
            gap: 10px;
        }

        .detail-tabs {
            background: white;
            border-bottom: 1px solid var(--zoho-border);
            padding: 0 25px;
            display: flex;
            gap: 5px;
        }

        .detail-tab {
            padding: 15px 20px;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            font-weight: 500;
        }

        .detail-tab:hover {
            color: var(--zoho-blue);
        }

        .detail-tab.active {
            color: var(--zoho-blue);
            border-bottom-color: var(--zoho-blue);
        }

        .detail-content {
            padding: 25px;
        }

        .detail-section {
            background: white;
            border-radius: 10px;
            border: 1px solid var(--zoho-border);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .detail-section-header {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid var(--zoho-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .detail-section-title {
            font-weight: 600;
            font-size: 15px;
        }

        .detail-section-body {
            padding: 20px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .detail-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .detail-field.full-width {
            grid-column: span 2;
        }

        .detail-field-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-field-value {
            font-size: 14px;
            color: var(--text-primary);
        }

        /* Related Lists */
        .related-list {
            margin-top: 20px;
        }

        .related-list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: white;
            border: 1px solid var(--zoho-border);
            border-radius: 10px 10px 0 0;
        }

        .related-list-title {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .related-list-title .count {
            background: var(--zoho-bg);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .related-table {
            background: white;
            border: 1px solid var(--zoho-border);
            border-top: none;
            border-radius: 0 0 10px 10px;
            overflow: hidden;
        }

        .related-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .related-table th {
            background: #f8f9fa;
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            border-bottom: 1px solid var(--zoho-border);
        }

        .related-table td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--zoho-border);
            font-size: 13px;
        }

        .related-table tr:last-child td {
            border-bottom: none;
        }

        .related-table tr:hover td {
            background: var(--zoho-bg);
        }

        /* Screenshot Gallery */
        .screenshot-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        .screenshot-item {
            background: white;
            border-radius: 10px;
            border: 1px solid var(--zoho-border);
            overflow: hidden;
            transition: all 0.2s;
        }

        .screenshot-item:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .screenshot-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--zoho-bg);
        }

        .screenshot-caption {
            padding: 12px 15px;
            font-size: 13px;
            color: var(--text-secondary);
            border-top: 1px solid var(--zoho-border);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--zoho-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            background: var(--zoho-bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--zoho-border);
            color: var(--text-primary);
        }

        .modal-body {
            padding: 25px;
            overflow-y: auto;
            max-height: calc(90vh - 140px);
        }

        .modal-footer {
            padding: 15px 25px;
            border-top: 1px solid var(--zoho-border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--zoho-border);
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--zoho-blue);
            box-shadow: 0 0 0 3px rgba(0,89,139,0.1);
        }

        .form-select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--zoho-border);
            border-radius: 6px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        .form-textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--zoho-border);
            border-radius: 6px;
            font-size: 14px;
            min-height: 100px;
            resize: vertical;
        }

        /* Dropdown */
        .dropdown {
            position: relative;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            border: 1px solid var(--zoho-border);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-width: 200px;
            display: none;
            z-index: 1000;
            overflow: hidden;
        }

        .dropdown-menu.active {
            display: block;
        }

        .dropdown-item {
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .dropdown-item:hover {
            background: var(--zoho-bg);
        }

        .dropdown-item i {
            width: 16px;
            color: var(--text-muted);
        }

        .dropdown-divider {
            height: 1px;
            background: var(--zoho-border);
            margin: 5px 0;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: white;
            border-radius: 8px;
            padding: 15px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .toast.success .toast-icon {
            background: #d4edda;
            color: var(--success);
        }

        .toast.error .toast-icon {
            background: #f8d7da;
            color: var(--danger);
        }

        .toast.info .toast-icon {
            background: #cce5ff;
            color: var(--info);
        }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-weight: 600;
            font-size: 14px;
        }

        .toast-message {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Kanban Board */
        .kanban-container {
            display: flex;
            gap: 15px;
            padding: 20px 25px;
            overflow-x: auto;
        }

        .kanban-column {
            min-width: 280px;
            background: var(--zoho-bg);
            border-radius: 10px;
            flex-shrink: 0;
        }

        .kanban-header {
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--zoho-border);
        }

        .kanban-title {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .kanban-count {
            background: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .kanban-body {
            padding: 10px;
            min-height: 400px;
        }

        .kanban-card {
            background: white;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--zoho-border);
            cursor: pointer;
            transition: all 0.2s;
        }

        .kanban-card:hover {
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .kanban-card-title {
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .kanban-card-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Filter Panel */
        .filter-panel {
            background: white;
            padding: 20px 25px;
            border-bottom: 1px solid var(--zoho-border);
            display: none;
        }

        .filter-panel.active {
            display: block;
        }

        .filter-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: flex-end;
        }

        .filter-field {
            flex: 1;
        }

        .filter-field label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        /* Column Chooser */
        .column-chooser {
            position: fixed;
            top: 0;
            right: -350px;
            width: 350px;
            height: 100vh;
            background: white;
            box-shadow: -4px 0 15px rgba(0,0,0,0.1);
            z-index: 1500;
            transition: right 0.3s;
        }

        .column-chooser.active {
            right: 0;
        }

        .column-chooser-header {
            padding: 20px;
            border-bottom: 1px solid var(--zoho-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .column-chooser-title {
            font-size: 16px;
            font-weight: 600;
        }

        .column-chooser-body {
            padding: 20px;
            overflow-y: auto;
            height: calc(100vh - 70px);
        }

        .column-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            cursor: pointer;
        }

        .column-option input {
            width: 18px;
            height: 18px;
            accent-color: var(--zoho-blue);
        }

        /* Save Filter Modal */
        .save-filter-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Quick Create */
        .quick-create-panel {
            position: fixed;
            top: 56px;
            right: -500px;
            width: 500px;
            height: calc(100vh - 56px);
            background: white;
            box-shadow: -4px 0 15px rgba(0,0,0,0.1);
            z-index: 1500;
            transition: right 0.3s;
            overflow-y: auto;
        }

        .quick-create-panel.active {
            right: 0;
        }

        .quick-create-header {
            padding: 20px;
            border-bottom: 1px solid var(--zoho-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .quick-create-title {
            font-size: 18px;
            font-weight: 600;
        }

        .quick-create-body {
            padding: 25px;
        }

        /* Owner Sidebar Panel */
        .owner-sidebar {
            width: 320px;
            background: white;
            border-left: 1px solid var(--zoho-border);
            overflow-y: auto;
        }

        .owner-section {
            padding: 20px;
            border-bottom: 1px solid var(--zoho-border);
        }

        .owner-section-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .owner-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .owner-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .owner-details h4 {
            font-size: 14px;
            margin-bottom: 2px;
        }

        .owner-details span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag-item {
            padding: 5px 12px;
            background: var(--zoho-bg);
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Launcher */
        .app-launcher {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        .launcher-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--zoho-blue);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,89,139,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s;
        }

        .launcher-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0,89,139,0.5);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--zoho-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Print Styles */
        @media print {
            .sidebar, .top-header, .toolbar, .pagination-container {
                display: none;
            }
            .main-content {
                margin-top: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Top Header -->
    <header class="top-header">
        <div class="top-header-left">
            <div class="zoho-logo">
                <i class="fas fa-cube"></i>
                <span>Zoho CRM</span>
            </div>
            <div class="global-search">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search for records, modules, reports..." id="globalSearch">
            </div>
        </div>
        <div class="top-header-right">
            <div class="header-icon-btn" title="Notifications" onclick="showToast('info', 'Notifications', 'You have 5 new notifications')">
                <i class="fas fa-bell"></i>
                <span class="badge">5</span>
            </div>
            <div class="header-icon-btn" title="Tasks" onclick="showToast('info', 'Tasks', 'You have 3 pending tasks')">
                <i class="fas fa-tasks"></i>
                <span class="badge">3</span>
            </div>
            <div class="header-icon-btn" title="Calendar" onclick="showToast('info', 'Calendar', 'No upcoming events today')">
                <i class="fas fa-calendar"></i>
            </div>
            <div class="header-icon-btn" title="Settings" onclick="showToast('info', 'Settings', 'Opening settings...')">
                <i class="fas fa-cog"></i>
            </div>
            <div class="user-profile" onclick="showToast('info', 'Profile', 'John Anderson - Administrator')">
                <div class="user-avatar">JA</div>
                <span>John Anderson</span>
                <i class="fas fa-chevron-down" style="font-size: 10px;"></i>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-menu-item active" onclick="navigateTo('dashboard')" data-section="dashboard">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </div>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-section-title">Modules</div>
                <div class="sidebar-menu-item" onclick="navigateTo('leads')" data-section="leads">
                    <i class="fas fa-user-plus"></i>
                    <span>Leads</span>
                </div>
                <div class="sidebar-menu-item" onclick="navigateTo('deals')" data-section="deals">
                    <i class="fas fa-handshake"></i>
                    <span>Deals</span>
                </div>
                <div class="sidebar-menu-item" onclick="navigateTo('contacts')" data-section="contacts">
                    <i class="fas fa-address-book"></i>
                    <span>Contacts</span>
                </div>
                <div class="sidebar-menu-item" onclick="navigateTo('accounts')" data-section="accounts">
                    <i class="fas fa-building"></i>
                    <span>Accounts</span>
                </div>
                <div class="sidebar-menu-item" onclick="navigateTo('tasks')" data-section="tasks">
                    <i class="fas fa-check-square"></i>
                    <span>Tasks</span>
                </div>
                <div class="sidebar-menu-item" onclick="navigateTo('events')" data-section="events">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Events</span>
                </div>
                <div class="sidebar-menu-item" onclick="navigateTo('calls')" data-section="calls">
                    <i class="fas fa-phone"></i>
                    <span>Calls</span>
                </div>
                <div class="sidebar-menu-item" onclick="toggleSubmenu(this)">
                    <i class="fas fa-chart-bar"></i>
                    <span>Reports</span>
                    <i class="fas fa-chevron-right sub-arrow"></i>
                </div>
                <div class="sidebar-submenu">
                    <div class="sidebar-submenu-item" onclick="showToast('info', 'Reports', 'Sales Report'); event.stopPropagation();">
                        <i class="fas fa-file-alt"></i> Sales Report
                    </div>
                    <div class="sidebar-submenu-item" onclick="showToast('info', 'Reports', 'Performance Report'); event.stopPropagation();">
                        <i class="fas fa-chart-line"></i> Performance
                    </div>
                    <div class="sidebar-submenu-item" onclick="showToast('info', 'Reports', 'Revenue Analysis'); event.stopPropagation();">
                        <i class="fas fa-dollar-sign"></i> Revenue Analysis
                    </div>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Automation</div>
                <div class="sidebar-menu-item" onclick="navigateTo('workflows')" data-section="workflows">
                    <i class="fas fa-magic"></i>
                    <span>Workflows</span>
                </div>
                <div class="sidebar-menu-item" onclick="navigateTo('sequences')" data-section="sequences">
                    <i class="fas fa-envelope-open-text"></i>
                    <span>Sequences</span>
                </div>
                <div class="sidebar-menu-item" onclick="navigateTo('automation')" data-section="automation">
                    <i class="fas fa-robot"></i>
                    <span>Blueprints</span>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Tools</div>
                <div class="sidebar-menu-item" onclick="navigateTo('import')" data-section="import">
                    <i class="fas fa-file-import"></i>
                    <span>Import Data</span>
                </div>
                <div class="sidebar-menu-item" onclick="navigateTo('export')" data-section="export">
                    <i class="fas fa-file-export"></i>
                    <span>Export Data</span>
                </div>
                <div class="sidebar-menu-item" onclick="navigateTo('templates')" data-section="templates">
                    <i class="fas fa-file-code"></i>
                    <span>Templates</span>
                </div>
            </div>

            <div class="sidebar-toggle" onclick="toggleSidebar()">
                <i class="fas fa-chevron-left" id="sidebarToggleIcon"></i>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <!-- Content will be dynamically loaded here -->
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Modal Title</h3>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Modal content -->
            </div>
            <div class="modal-footer" id="modalFooter">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="closeModal(); showToast('success', 'Saved', 'Changes saved successfully')">Save</button>
            </div>
        </div>

        // Toggle Record Selection
        function toggleRecord(id) {
            if (selectedRecords.has(id)) {
                selectedRecords.delete(id);
            } else {
                selectedRecords.add(id);
            }
            document.querySelector(`tr[data-id="${id}"]`)?.classList.toggle('selected');
        }

        // Toggle All Records
        function toggleAllRecords(checkbox) {
            const rows = document.querySelectorAll('.data-table tbody tr');
            rows.forEach(row => {
                const id = parseInt(row.dataset.id);
                if (checkbox.checked) {
                    selectedRecords.add(id);
                    row.classList.add('selected');
                    row.querySelector('.record-checkbox').checked = true;
                } else {
                    selectedRecords.delete(id);
                    row.classList.remove('selected');
                    row.querySelector('.record-checkbox').checked = false;
                }
            });
        }

                                                    ${['Lead Management Interface', 'Deal Pipeline View', 'Contact Details Panel', 'Automation Workflow Builder', 
                                                      'Email Integration', 'Call Logging Screen', 'Report Dashboard', 'Mobile CRM View'][i]}
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Owner Sidebar -->
                    <div class="owner-sidebar">
                        <div class="owner-section">
                            <h4 class="owner-section-title">
                                <i class="fas fa-user"></i> Lead Owner
                            </h4>
                            <div class="owner-info">
                                <div class="owner-avatar">JA</div>
                                <div class="owner-details">
                                    <h4>John Anderson</h4>
                                    <span>Sales Manager</span>
                                </div>
                            </div>
                            <button class="btn btn-secondary btn-sm" style="width: 100%;" onclick="showToast('info', 'Change Owner', 'Select new owner')">
                                Change Owner
                            </button>
                        </div>

                        <div class="owner-section">
                            <h4 class="owner-section-title">
                                <i class="fas fa-tags"></i> Tags
                            </h4>
                            <div class="tags-list">
                                <span class="tag-item">Hot Lead</span>
                                <span class="tag-item">Enterprise</span>
                                <span class="tag-item">Decision Maker</span>
                                <span class="tag-item" style="cursor: pointer; color: var(--zoho-blue);">
                                    <i class="fas fa-plus"></i> Add Tag
                                </span>
                            </div>
                        </div>

                        <div class="owner-section">
                            <h4 class="owner-section-title">
                                <i class="fas fa-calendar"></i> Key Dates
                            </h4>
                            <div class="detail-field" style="margin-bottom: 12px;">
                                <span class="detail-field-label">Created</span>
                                <span class="detail-field-value">Jan 15, 2024</span>
                            </div>
                            <div class="detail-field" style="margin-bottom: 12px;">
                                <span class="detail-field-label">Modified</span>
                                <span class="detail-field-value">Mar 8, 2024</span>
                            </div>
                            <div class="detail-field" style="margin-bottom: 12px;">
                                <span class="detail-field-label">Last Activity</span>
                                <span class="detail-field-value">2 hours ago</span>
                            </div>
                        </div>

                        <div class="owner-section">
                            <h4 class="owner-section-title">
                                <i class="fas fa-chart-pie"></i> Analytics
                            </h4>
                            <div class="detail-field" style="margin-bottom: 12px;">
                                <span class="detail-field-label">Total Deals</span>
                                <span class="detail-field-value">3</span>
                            </div>
                            <div class="detail-field" style="margin-bottom: 12px;">
                                <span class="detail-field-label">Total Value</span>
                                <span class="detail-field-value">$185,000</span>
                            </div>
                            <div class="detail-field" style="margin-bottom: 12px;">
                                <span class="detail-field-label">Activities</span>
                                <span class="detail-field-value">24</span>
                            </div>
                        </div>

                        <div class="owner-section">
                            <h4 class="owner-section-title">
                                <i class="fas fa-link"></i> Integrations
                            </h4>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                <div style="width: 40px; height: 40px; background: var(--zoho-bg); border-radius: 8px; display: flex; align-items: center; justify-content: center;" title="Zoho Mail">
                                    <i class="fas fa-envelope" style="color: var(--zoho-blue);"></i>
                                </div>
                                <div style="width: 40px; height: 40px; background: var(--zoho-bg); border-radius: 8px; display: flex; align-items: center; justify-content: center;" title="Zoho Desk">
                                    <i class="fas fa-headset" style="color: var(--zoho-blue);"></i>
                                </div>
                                <div style="width: 40px; height: 40px; background: var(--zoho-bg); border-radius: 8px; display: flex; align-items: center; justify-content: center;" title="Zoho Books">
                                    <i class="fas fa-book" style="color: var(--zoho-blue);"></i>
                                </div>
                                <div style="width: 40px; height: 40px; background: var(--zoho-bg); border-radius: 8px; display: flex; align-items: center; justify-content: center;" title="Google Workspace">
                                    <i class="fab fa-google" style="color: #4285f4;"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render Screenshots View (for detail tabs)
        function renderScreenshotsView() {
            const mainContent = document.getElementById('mainContent');
            showToast('info', 'Screenshots', 'Loading Zoho CRM screenshots gallery');
        }

        // Show Create Modal
        function showCreateModal(type) {
            const titles = {
                leads: 'Create New Lead',
                contacts: 'Create New Contact',
                accounts: 'Create New Account',
                deals: 'Create New Deal'
            };

            document.getElementById('modalTitle').textContent = titles[type] || 'Create Record';
            document.getElementById('modalBody').innerHTML = `
                <form class="save-filter-form">
                    <div class="form-group">
                        <label class="form-label">Name *</label>
                        <input type="text" class="form-input" placeholder="Enter name">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" placeholder="Enter email address">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input type="tel" class="form-input" placeholder="Enter phone number">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Industry</label>
                        <select class="form-select">
                            <option>Select Industry</option>
                            <option>Technology</option>
                            <option>Healthcare</option>
                            <option>Finance</option>
                            <option>Retail</option>
                            <option>Manufacturing</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <select class="form-select">
                            <option>Active</option>
                            <option>Inactive</option>
                            <option>Pending</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea class="form-textarea" placeholder="Enter description"></textarea>
                    </div>
                </form>
            `;
            document.getElementById('modalFooter').innerHTML = `
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="closeModal(); showToast('success', 'Created', 'Record created successfully')">
                    <i class="fas fa-check"></i> Create
                </button>
            `;
            document.getElementById('modalOverlay').classList.add('active');
        }

        // Show Edit Modal
        function showEditModal(id) {
            const record = sampleRecords.find(r => r.id === id);
            if (!record) return;

            document.getElementById('modalTitle').textContent = 'Edit Record';
            document.getElementById('modalBody').innerHTML = `
                <form class="save-filter-form">
                    <div class="form-group">
                        <label class="form-label">Name *</label>
                        <input type="text" class="form-input" value="${record.name}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" value="${record.email}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input type="tel" class="form-input" value="${record.phone}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <select class="form-select">
                            <option ${record.status === 'Active' ? 'selected' : ''}>Active</option>
                            <option ${record.status === 'Inactive' ? 'selected' : ''}>Inactive</option>
                            <option ${record.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option ${record.status === 'New' ? 'selected' : ''}>New</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Industry</label>
                        <input type="text" class="form-input" value="${record.industry}">
                    </div>
                </form>
            `;
            document.getElementById('modalFooter').innerHTML = `
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="closeModal(); showToast('success', 'Updated', 'Record updated successfully')">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            `;
            document.getElementById('modalOverlay').classList.add('active');
        }

        // Show Save Filter Modal
        function showSaveFilterModal() {
            document.getElementById('modalTitle').textContent = 'Save Filter';
            document.getElementById('modalBody').innerHTML = `
                <form class="save-filter-form">
                    <div class="form-group">
                        <label class="form-label">Filter Name *</label>
                        <input type="text" class="form-input" placeholder="Enter filter name">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea class="form-textarea" placeholder="Enter description (optional)"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">
                            <input type="checkbox"> Set as default filter
                        </label>
                    </div>
                </form>
            `;
            document.getElementById('modalFooter').innerHTML = `
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="closeModal(); showToast('success', 'Saved', 'Filter saved successfully')">
                    <i class="fas fa-save"></i> Save Filter
                </button>
            `;
            document.getElementById('modalOverlay').classList.add('active');
        }

        // Close Modal
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // Show Toast
        function showToast(type, title, message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div class="toast-icon">
                    <i class="fas ${type === 'success' ? 'fa-check' : type === 'error' ? 'fa-times' : 'fa-info'}"></i>
                </div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // Global Search Handler
        document.getElementById('globalSearch').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const query = this.value.trim();
                if (query) {
                    showToast('info', 'Search', `Searching for "${query}"...`);
                    setTimeout(() => {
                        navigateTo('leads');
                        this.value = '';
                    }, 1000);
                }
            }
        });

        // Keyboard Shortcuts
        document.addEventListener('keydown', function(e) {
            // Ctrl+N - New Record
            if (e.ctrlKey && e.key === 'n') {
                e.preventDefault();
                toggleQuickCreate();
            }
            // Escape - Close Panels
            if (e.key === 'Escape') {
                closeModal();
                document.getElementById('columnChooser').classList.remove('active');
                document.getElementById('quickCreatePanel').classList.remove('active');
                document.getElementById('filterPanel').classList.remove('active');
            }
        });

        // Click outside to close dropdowns
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.dropdown')) {
                document.querySelectorAll('.dropdown-menu.active').forEach(menu => {
                    menu.classList.remove('active');
                });
            }
        });

        // Initialize Dashboard on Load
        window.addEventListener('DOMContentLoaded', function() {
            navigateTo('dashboard');
        });
    </script>
</body>
</html>
